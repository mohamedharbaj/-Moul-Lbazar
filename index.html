  <body class="bg-[#F5EFE3] text-[#292521] antialiased selection:bg-[#B08A45] selection:text-white">
    <div id="root">
      <div id="app-startup-status" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#F5EFE3;color:#3B2921;font-family:system-ui,sans-serif;direction:rtl">
        جار تحميل موقع مول البزار...
      </div>
    </div>
    <script>
      function showErr(msg) {
        var r = document.getElementById('root') || document.body;
        var d = document.createElement('pre');
        d.style.cssText = 'padding:16px;margin:16px;background:#fff;color:#b00020;border:2px solid #b00020;border-radius:8px;font:13px monospace;white-space:pre-wrap;direction:ltr;word-break:break-word';
        d.textContent = msg;
        r.appendChild(d);
      }
      window.addEventListener('error', function (e) {
        showErr('JS ERROR: ' + e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') + (e.error && e.error.stack ? '\n' + e.error.stack : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        showErr('PROMISE ERROR: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
      });
    </script>
    <script>
      // Diagnostic only: report whether the browser executes the built app entry.
      window.__moulEntryStarted = false;
      window.addEventListener('error', function (e) {
        showErr('BROWSER ERROR: ' + e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        showErr('PROMISE ERROR: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
      });
      setTimeout(function () {
        var status = document.getElementById('app-startup-status');
        if (status && document.getElementById('root').contains(status)) {
          status.textContent = 'DIAGNOSTIC: ملف التطبيق لم يستبدل شاشة التحميل خلال 12 ثانية. هذا يعني أن React لم يركب الواجهة بعد.';
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"
      onload="window.__moulEntryStarted=true; var s=document.getElementById('app-startup-status'); if(s && document.getElementById('root').contains(s)){s.textContent='DIAGNOSTIC: تم تحميل ملف JavaScript بنجاح، لكن واجهة React لم تظهر.';}"
      onerror="var s=document.getElementById('app-startup-status'); if(s){s.textContent='DIAGNOSTIC: فشل تحميل ملف JavaScript الرئيسي.';} showErr('MODULE LOAD ERROR: تعذر تحميل ملف تشغيل الموقع.');"></script>
  </body>
</html>
